<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>(체험용) 가나장비 지원서 작성</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; color: #1b2333; }
  .q { margin: 20px 0; padding: 16px; border: 1px solid #dde3ee; border-radius: 12px; }
  textarea { width: 100%; height: 160px; margin-top: 8px; }
  .note { background: #fff7e0; padding: 10px 14px; border-radius: 8px; }
  button { padding: 10px 18px; margin-right: 8px; }
</style>
<h1>가나장비 2026 하반기 CS 엔지니어 지원서</h1>
<p class="note">체험용 가짜 지원서입니다. 앱이 아래 칸을 채우는지 확인해 보세요. 버튼은 눌러도 아무 데도 보내지 않습니다.</p>
<div><label for="name">이름</label> <input type="text" id="name" value="김예시"></div>
<div class="q"><p>1. 예상하지 못한 문제를 끝까지 해결한 경험을 작성해 주세요. (800자 이내)</p><textarea maxlength="800"></textarea></div>
<div class="q"><p>2. 가나장비와 CS 엔지니어 직무에 지원한 이유를 구체적으로 작성해 주세요. (700자 이내)</p><textarea maxlength="700"></textarea></div>
<div class="q"><p>3. 고객 또는 동료와 의견이 달랐던 상황에서 어떻게 해결했는지 작성해 주세요. (600자 이내)</p><textarea maxlength="600"></textarea></div>
<button onclick="alert('체험용 페이지라 저장되지 않습니다.')">임시저장</button>
<button onclick="alert('체험용 페이지라 제출되지 않습니다.')">제출</button>
</html>
